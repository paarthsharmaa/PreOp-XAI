# Publishes the findings pages only, from committed aggregate results.
# Manual on purpose: confirm that the MOVER data usage agreement permits publishing these aggregates first.
name: Publish findings site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: python -m app.build_data
      - run: npm ci
        working-directory: app/web
      - run: npm run build:static
        working-directory: app/web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/web/dist-static
      - id: deployment
        uses: actions/deploy-pages@v4
