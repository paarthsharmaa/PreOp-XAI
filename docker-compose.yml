# Local use only. The web port binds to 127.0.0.1 and the API has no published port.
# Do not deploy the API publicly: its artifacts derive from MOVER patient data.
services:
  api:
    build:
      context: .
      dockerfile: app/Dockerfile.api
    volumes:
      - ./artifacts:/srv/artifacts:ro
      - ./data/vitaldb:/srv/data/vitaldb:ro
    expose:
      - "8000"
    healthcheck:
      test: [CMD, .venv/bin/python, -c, "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 24

  web:
    build:
      context: .
      dockerfile: app/Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
