[project]
name = "preop-xai"
version = "0.1.0"
description = "Explainable preoperative risk prediction on MOVER with external validation on VitalDB"
requires-python = "==3.13.*"
dependencies = [
  "scikit-learn==1.8.0",
  "xgboost==2.1.4",
  "numpy==2.4.4",
  "pandas==3.0.2",
  "scipy==1.17.1",
  "matplotlib==3.10.9",
  "pydantic==2.12.5",
  "typer>=0.29.2",
  "fastapi>=0.165.0",
  "uvicorn>=0.54.0",
]

[project.scripts]
preopxai = "pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/preopxai", "pipeline", "data_prep", "app"]
exclude = ["app/web"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "httpx>=0.28.1",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = [".", "src"]

[tool.ruff]
target-version = "py313"
line-length = 120
include = ["app/**/*.py", "pipeline/**/*.py", "tests/**/*.py"]
# Scientific modules keep their established formatting.
exclude = [
  "pipeline/protocol.py",
  "pipeline/reporting/figs_mover.py",
  "pipeline/reporting/figstyle.py",
  "pipeline/reporting/summarize.py",
  "tests/shap_selftest.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["app", "pipeline", "preopxai", "data_prep"]

[tool.basedpyright]
include = ["pipeline", "tests"]
exclude = [
  "pipeline/protocol.py",
  "pipeline/reporting/figs_mover.py",
  "pipeline/reporting/figstyle.py",
  "pipeline/reporting/summarize.py",
  "tests/shap_selftest.py",
]
extraPaths = ["src", "."]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
