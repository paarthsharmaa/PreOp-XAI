[project]
name = "preop-xai"
version = "0.1.0"
description = "Explainable preoperative risk prediction on MOVER with external validation on VitalDB"
requires-python = "==3.13.*"
dependencies = [
  "scikit-learn==1.8.0",
  "xgboost==2.1.4",
  "numpy==2.4.4",
  "pandas==3.0.2",
  "scipy==1.17.1",
  "matplotlib==3.10.9",
  "pydantic==2.12.5",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.basedpyright]
include = ["scripts"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "all"
